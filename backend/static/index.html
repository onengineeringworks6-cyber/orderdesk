<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Desk</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f0d">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Order Desk">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0b0f0d;
    --black-2: #141a17;
    --ink: #101613;
    --white: #ffffff;
    --bg: #f2f5f3;
    --line: #e1e7e3;
    --muted: #5d6a63;
    --green: #15803d;
    --green-dark: #166534;
    --green-bright: #22c55e;
    --green-soft: #e6f5ec;
    --green-mid: #b9e5c9;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --radius: 12px;
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --side: 250px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--green-bright); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .muted { color: var(--muted); }
  .strong { font-weight: 500; }

  /* ---------- buttons & forms ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    border: 1px solid var(--line); background: var(--white); padding: 9px 16px;
    border-radius: 9px; cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s;
  }
  .btn:hover { border-color: #b8c4bd; }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.primary:hover { background: var(--green-dark); border-color: var(--green-dark); }
  .btn.dark { background: var(--black); border-color: var(--black); color: #fff; }
  .btn.sm { padding: 5px 12px; font-size: 13px; border-radius: 8px; }
  .btn.sm:hover { border-color: var(--green); color: var(--green); }
  label.chk { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink); font-weight: 400; cursor: pointer; }
  label.chk input { width: auto; accent-color: var(--green); }
  .btn:disabled { opacity: .55; cursor: default; }
  .link { background: none; border: 0; padding: 0; color: var(--green); cursor: pointer; font-weight: 500; }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }

  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
  input, select {
    width: 100%; background: var(--white); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 12px;
  }
  input:focus, select:focus { border-color: var(--green); outline: none; box-shadow: 0 0 0 3px var(--green-soft); }
  .field { margin-bottom: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 0 0 8px; }

  /* ---------- auth ---------- */
  #auth { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; }
  .auth-art {
    background:
      radial-gradient(circle at 15% 110%, rgba(34,197,94,.55), transparent 45%),
      radial-gradient(circle at 105% -10%, rgba(34,197,94,.28), transparent 40%),
      var(--black);
    color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .auth-art h2 { font-size: 36px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; margin: 0 0 14px; max-width: 420px; }
  .auth-art p { margin: 0; color: #a9b8af; max-width: 380px; }
  .auth-form { display: grid; place-items: center; padding: 32px; background: var(--white); }
  .auth-card { width: 100%; max-width: 340px; }
  .auth-card h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
  .auth-card p.sub { margin: 0 0 26px; color: var(--muted); }
  .auth-card .btn { width: 100%; padding: 11px 16px; }
  .auth-switch { margin-top: 20px; font-size: 14px; color: var(--muted); text-align: center; }

  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
  .logo-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--green-bright); color: var(--black); display: grid; place-items: center; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
  aside {
    background: var(--black); color: #cfd9d3; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; padding: calc(22px + env(safe-area-inset-top, 0px)) 14px 16px; z-index: 30;
  }
  aside .logo { color: #fff; padding: 0 8px 26px; }
  .side-label { font-size: 12px; color: #6d7d74; padding: 0 12px 8px; }
  #nav { display: flex; flex-direction: column; gap: 3px; }
  #nav button {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: none; border: 0; color: #a9b8af; padding: 10px 12px; border-radius: 9px; cursor: pointer;
    position: relative; transition: background .15s, color .15s;
  }
  #nav button:hover { background: var(--black-2); color: #fff; }
  #nav button[aria-current="page"] { background: rgba(34,197,94,.14); color: #4ade80; font-weight: 500; }
  #nav button[aria-current="page"]::before {
    content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; background: var(--green-bright); border-radius: 0 3px 3px 0;
  }
  .side-foot { margin-top: auto; border-top: 1px solid #1f2823; padding-top: 14px; display: flex; align-items: center; gap: 10px; }
  .avatar-lg { width: 36px; height: 36px; border-radius: 50%; background: var(--green-bright); color: var(--black); display: grid; place-items: center; font-weight: 600; flex: none; }
  .side-foot .who { min-width: 0; flex: 1; }
  .side-foot .who b { display: block; color: #fff; font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-foot .who small { color: #6d7d74; font-size: 12px; }
  #logout { background: none; border: 0; color: #8ea097; cursor: pointer; padding: 6px; border-radius: 8px; display: grid; }
  #logout:hover { background: var(--black-2); color: #fff; }

  .topbar { display: none; }
  .content { min-width: 0; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 32px 80px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  h1.title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .head p { margin: 2px 0 0; color: var(--muted); }

  /* ---------- cards ---------- */
  .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .card h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .section-title { font-size: 15px; font-weight: 600; color: var(--ink); margin: 28px 0 10px; }
  .section-title:first-child { margin-top: 0; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .stat { position: relative; overflow: hidden; }
  .stat .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--green-soft); color: var(--green); display: grid; place-items: center; margin-bottom: 14px; }
  .stat span.l { display: block; color: var(--muted); font-size: 13px; }
  .stat strong { display: block; font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat small { color: var(--muted); font-size: 13px; }
  .stat.hero { background: var(--green); border-color: var(--green); color: #fff; }
  .stat.hero .ic { background: rgba(255,255,255,.18); color: #fff; }
  .stat.hero span.l, .stat.hero small { color: #d3f0dd; }
  .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid2.even { grid-template-columns: 1fr 1fr; }

  /* chart & donut */
  .chart svg { width: 100%; height: auto; display: block; }
  .bar { fill: var(--green-mid); }
  .bar.now { fill: var(--green); }
  .chart text { font: 12px var(--font); fill: var(--muted); }
  .chart text.v { fill: var(--ink); font-weight: 500; }
  .donut-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .donut { width: 128px; height: 128px; flex: none; position: relative; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .track { stroke: var(--green-soft); }
  .donut .val { stroke: var(--green); stroke-linecap: round; }
  .donut .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 24px; font-weight: 600; }
  .donut .mid small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: -4px; }
  .legend { display: grid; gap: 12px; }
  .legend div { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--green); }
  .legend i.b { background: var(--green-soft); box-shadow: inset 0 0 0 1px var(--green-mid); }
  .legend strong { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend span { color: var(--muted); font-size: 13px; }

  /* mini lists */
  .rows { display: grid; }
  .r { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .r:first-child { border-top: 0; padding-top: 0; }
  .r:last-child { padding-bottom: 0; }
  .r .grow { flex: 1; min-width: 0; }
  .r .grow b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r .grow small { color: var(--muted); font-size: 13px; }
  .r .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
  .av { width: 34px; height: 34px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
  .av.sm { width: 28px; height: 28px; font-size: 12px; }
  .cellc { display: flex; align-items: center; gap: 10px; }

  .pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 99px; background: var(--green-soft); color: var(--green); white-space: nowrap; }
  .pill.done { background: var(--black); color: #fff; }
  .pill.late { background: var(--danger-soft); color: var(--danger); }
  .pill.pending { background: #fdf2e3; color: #a15c07; }
  .pill.type-new { background: var(--green-soft); color: var(--green-dark); }
  .pill.type-labour { background: #eaf0fb; color: #2451b3; }
  .pill.type-repair { background: #fdf2e3; color: #a15c07; }
  .pill.type-trading { background: #f3eafd; color: #6a2bb0; }

  /* ---------- tables / lists ---------- */
  .toolbar { display: flex; gap: 12px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .toolbar input[type=search] { max-width: 320px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--white); }
  .seg button { background: none; border: 0; padding: 9px 16px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--black); color: #fff; font-weight: 500; }

  .wrap { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 780px; }
  th, td { padding: 13px 18px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-weight: 500; font-size: 13px; color: var(--muted); background: #fafcfb; }
  th.num, td.num { text-align: right; }
  tbody tr:hover td { background: #fafcfb; }
  tr:last-child td { border-bottom: 0; }
  .wrap.plain { border: 0; }

  .grid { display: grid; grid-template-columns: 2fr 1.3fr .7fr .7fr 1.2fr; gap: 12px; align-items: center; }
  .list-head { padding: 12px 18px; font-size: 13px; font-weight: 500; color: var(--muted); background: #fafcfb; border-bottom: 1px solid var(--line); }
  details.row { border-bottom: 1px solid var(--line); }
  details.row:last-child { border-bottom: 0; }
  details.row summary { padding: 14px 18px; cursor: pointer; list-style: none; }
  details.row summary::-webkit-details-marker { display: none; }
  details.row summary:hover { background: #fafcfb; }
  details.row[open] summary { background: var(--green-soft); }
  .detail { padding: 16px 18px 20px; background: #fafcfb; }
  .detail .addr { color: var(--muted); margin: 0 0 12px; }
  .detail table { min-width: 0; }
  .detail .wrap { border-radius: 10px; }

  .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .prod { display: flex; flex-direction: column; gap: 8px; transition: border-color .15s; }
  .prod:hover { border-color: var(--green-mid); }
  .prod small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .prod b { font-size: 16px; font-weight: 600; }
  .prod p { margin: 0; color: var(--muted); flex: 1; }

  .empty { text-align: center; padding: 44px 16px; color: var(--muted); }
  .empty p { margin: 0 0 12px; }
  .empty.sm { padding: 18px 0; }

  /* ---------- dialog & toast ---------- */
  dialog { border: 0; border-radius: 16px; padding: 26px; width: min(480px, calc(100vw - 32px)); background: var(--white); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.28); }
  dialog::backdrop { background: rgba(8, 12, 10, .55); }
  dialog h2 { margin: 0 0 20px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .calc { background: var(--green-soft); color: var(--green-dark); border-radius: 9px; padding: 10px 12px; font-size: 14px; margin: 0 0 14px; }
  .calc strong { font-weight: 600; font-variant-numeric: tabular-nums; }
  .sheet { display: flex; flex-direction: column; gap: 4px; }
  .sheet-item { text-align: left; background: none; border: 0; border-radius: 9px; padding: 12px 14px; font: inherit; font-weight: 500; color: var(--ink); cursor: pointer; }
  .sheet-item:hover { background: var(--green-soft); color: var(--green-dark); }
  .sheet-item.danger { color: var(--danger); }
  .sheet-item.danger:hover { background: var(--danger-soft); }
  .sheet-item.stage-pick { display: flex; align-items: center; gap: 10px; }
  .sheet-item.stage-pick.active { background: var(--green-soft); color: var(--green-dark); }
  .stage-num { width: 22px; height: 22px; border-radius: 50%; background: var(--line, #e1e7e3); color: var(--muted); font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .sheet-item.stage-pick.active .stage-num { background: var(--green); color: #fff; }
  .stage-dots { display: flex; align-items: center; }
  .stage-dots .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line, #e1e7e3); flex: none; }
  .stage-dots .dot.on { background: var(--green); }
  .stage-dots .ln { width: 8px; height: 2px; background: var(--line, #e1e7e3); }
  .stage-dots .ln.on { background: var(--green); }
  .stage-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .timeline { display: flex; flex-direction: column; gap: 14px; max-height: 360px; overflow-y: auto; margin: 4px 0 18px; }
  .timeline .ev { display: flex; gap: 10px; }
  .timeline .ev .dot2 { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-top: 6px; flex: none; }
  .timeline .ev .body b { display: block; font-weight: 600; font-size: 14px; }
  .timeline .ev .body div { font-size: 13px; color: var(--ink); margin-top: 1px; }
  .timeline .ev .body small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
  .photo { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--line); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-del { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; cursor: pointer; line-height: 1; }
  .photo-cap { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--black); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; border-left: 3px solid var(--green-bright); z-index: 60; }
  #toast.show { opacity: 1; }
  .scrim { display: none; }

  /* ---------- responsive ---------- */
  /* Large tablet landscape (e.g. 11" iPad Pro ~1194px) and small laptops */
  @media (max-width: 1180px) {
    :root { --side: 220px; }
    main { padding: 28px 24px 72px; }
  }
  /* Tablet range: 11" landscape (~1194) down through portrait (~834) */
  @media (max-width: 1024px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid2, .grid2.even { grid-template-columns: 1fr; }
    .prod-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  }
  /* Below this, sidebar becomes a slide-out drawer: covers 11" portrait tablets and all phones */
  @media (max-width: 900px) {
    :root { --side: 270px; }
    #auth { grid-template-columns: 1fr; }
    .auth-art { display: none; }
    .shell { grid-template-columns: 1fr; }
    aside { position: fixed; left: 0; top: 0; bottom: 0; width: var(--side); transform: translateX(-100%); transition: transform .2s; }
    body.nav-open aside { transform: none; }
    body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 25; }
    .topbar { display: flex; align-items: center; gap: 12px; background: var(--black); color: #fff; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px; position: sticky; top: 0; z-index: 20; }
    .topbar button { background: none; border: 0; color: #fff; cursor: pointer; display: grid; padding: 8px; min-width: 40px; min-height: 40px; place-items: center; }
    main { padding: 24px 20px 64px; }
    .head { align-items: flex-start; }
    .grid { grid-template-columns: 1fr 1fr; }
    .list-head { display: none; }
    .two { grid-template-columns: 1fr; }
    /* larger touch targets */
    #nav button { padding: 13px 14px; font-size: 15px; }
    .btn { padding: 11px 16px; }
    .btn.sm { padding: 9px 14px; }
    th, td { padding: 12px 14px; }
    input, select { padding: 11px 12px; font-size: 16px; }
    .seg button { padding: 11px 14px; }
    dialog { padding: 22px; }
  }
  @media (max-width: 640px) {
    .stats { grid-template-columns: 1fr; }
    .donut-wrap { justify-content: center; text-align: left; }
    .head { flex-direction: column; align-items: stretch; }
    .head .btn { width: 100%; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar input[type=search] { max-width: none; }
    .seg { width: 100%; }
    .seg button { flex: 1; }
    .prod-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  }
  @media (max-width: 420px) {
    .prod-grid { grid-template-columns: 1fr; }
    .card { padding: 16px; }
    main { padding: 20px 14px 56px; }
  }
  @media (hover: none) and (pointer: coarse) {
    .btn, #nav button, .link, .seg button, details.row summary { min-height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  #view.view-enter { animation: viewIn .22s ease; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- invoice / receipt (only shown for printing) ---------- */
  .print-only { display: none; }
  .inv { font-family: inherit; color: #111; padding: 24px; max-width: 700px; margin: 0 auto; background: #fff; }
  .inv-head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #111; padding-bottom: 12px; margin-bottom: 18px; }
  .inv-head h1 { margin: 0; font-size: 22px; }
  .inv-head p { margin: 2px 0 0; font-size: 12px; color: #555; }
  .inv-meta { text-align: right; }
  .inv-meta h2 { margin: 0 0 4px; font-size: 16px; }
  .inv-meta p { margin: 0; font-size: 12px; color: #555; }
  .inv-parties { display: flex; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
  .inv-parties b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #777; margin-bottom: 4px; }
  .inv-parties p { margin: 0 0 2px; font-size: 13px; }

<body>

<!-- ================= AUTH ================= -->

</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="invoicePrint" class="print-only"></div>

<script>
/* ---------- config ---------- */
// Empty = same origin (page served by Express on :3000). Otherwise (file:// or a dev server) it calls localhost:3000.
const isLocalDev = location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);
const API = isLocalDev && location.port !== '3000' ? 'http://localhost:3000' : '';

/* ---------- icons ---------- */
const ICONS = {
  logo: '<path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>',
  dashboard: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  orders: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  clients: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.8c2 .7 3.2 2.4 3.5 5.2"/>',
  products: '<path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/>',
  logout: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  wallet: '<path d="M3 7a2 2 0 012-2h13v4"/><path d="M3 7v10a2 2 0 002 2h15a1 1 0 001-1V10a1 1 0 00-1-1H5a2 2 0 01-2-2z"/><circle cx="16.5" cy="14" r="1"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  download: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/>',
  trash: '<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/>',
  quotes: '<path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v5h5"/><path d="M8 13h8"/><path d="M8 17h5"/>',
  employees: '<circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/>'
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
function paintIcons(root = document) { root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); el.style.display = 'grid'; }); }
function logoInto() { document.querySelectorAll('.logo-mark').forEach(el => { el.innerHTML = icon('logo'); }); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const compact = n => n >= 1e7 ? (n / 1e7).toFixed(1).replace(/\.0$/, '') + 'Cr' : n >= 1e5 ? (n / 1e5).toFixed(1).replace(/\.0$/, '') + 'L' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(n));
const today = () => new Date().toISOString().slice(0, 10);
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const initial = s => esc((String(s || '?').trim()[0] || '?').toUpperCase());
function parseDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
}
const ts = s => { const d = parseDate(s); return isNaN(d) ? Infinity : d.getTime(); };
function fmtDate(s) {
  const d = parseDate(s);
  return isNaN(d) ? esc(s) : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtDateTime(s) {
  const d = new Date(s);
  return isNaN(d) ? esc(s) : d.toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function waLink(phone, text) {
  const digits = String(phone || '').replace(/\D/g, '');
  const intl = digits.length === 10 ? '91' + digits : digits;
  return `https://wa.me/${intl}?text=${encodeURIComponent(text)}`;
}
function compressImage(file, maxDim = 1000, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read that image'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.readAsDataURL(file);
  });
}
const sum = (arr, k) => arr.reduce((t, x) => t + (Number(x[k]) || 0), 0);
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

let authToken = localStorage.getItem('odToken') || null;
// Set when someone scans an order's QR code (link looks like /#order=<id>).
let pendingOrderId = (location.hash.match(/^#order=([a-f0-9]{24})$/i) || [])[1] || null;
async function api(path, method = 'GET', body) {
  const opts = { method, headers: {} };
  if (authToken) opts.headers['Authorization'] = 'Bearer ' + authToken;
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(API + path, opts); }
  catch { throw new Error('Cannot reach the server. Check that the backend is running.'); }
  let data = null;
  try { data = await res.json(); } catch {}
  if (res.status === 401 && path !== '/login' && path !== '/signup') {
    doLogout();
    throw new Error((data && (data.error || data.message)) || 'Please log in again');
  }
  if (!res.ok) throw new Error((data && (data.error || data.message)) || `Request failed (${res.status})`);
  return data;
}

/* ---------- state ---------- */
const state = { view: 'dashboard', role: 'admin', orders: [], clients: [], products: [], deletedOrders: [], deletedClients: [], team: [], quotes: [], employees: [], attendance: [], attMonth: today().slice(0, 7), filter: 'All', q: '' };
const clientName = id => (state.clients.find(c => c._id === id) || {}).name || 'Unknown client';
const productName = id => (state.products.find(p => p._id === id) || {}).name || '';
const orderProfit = o => (o.TotalValue || 0) - (o.PurchaseCost || 0) - sum(o.Expenses || [], 'amount');
const STATUSES = ['Active', 'Payment Due', 'Closed'];
const statusPill = s => {
  const cls = s === 'Closed' ? 'done' : s === 'Payment Due' ? 'pending' : '';
  return `<span class="pill ${cls}">${esc(s)}</span>`;
};

/* v1: one shared 6-step roadmap for every order type (used to vary by type). */
const ORDER_TYPES = ['New Order', 'Labour Job', 'Repairing', 'Trading'];
const STAGES = ['Raw material', 'Processing', 'Completion of order', 'To be delivered', 'Delivered', 'Money received'];
const TYPE_SHORT = { 'New Order': 'New', 'Labour Job': 'Labour', 'Repairing': 'Repair', 'Trading': 'Trading' };
const typePill = t => `<span class="pill type-${(TYPE_SHORT[t] || 'New').toLowerCase()}">${esc(TYPE_SHORT[t] || 'New')}</span>`;
const orderTitle = o => o.OrderName && o.OrderName !== o.OrderID ? o.OrderName : o.OrderID;
function stageDots(stage) {
  const n = STAGES.length;
  stage = Math.min(stage || 1, n);
  const parts = Array.from({ length: n }, (_, idx) => {
    const i = idx + 1;
    const dot = `<span class="dot${i <= stage ? ' on' : ''}"></span>`;
    const ln = idx < n - 1 ? `<span class="ln${i < stage ? ' on' : ''}"></span>` : '';
    return dot + ln;
  }).join('');
  return `<div class="cellc" title="${esc(STAGES[stage - 1])} (step ${stage} of ${n})">
    <div class="stage-dots">${parts}</div><span class="stage-label">${esc(STAGES[stage - 1])}</span></div>`;
}

/* ---------- derived data (always computed fresh from state.orders,
   so a local order patch instantly keeps client/dashboard stats correct
   without needing a server round-trip) ---------- */
const clientOrders = id => state.orders.filter(o => o.Client === id);
function clientStats(id) {
  const os = clientOrders(id);
  return {
    TotalOrders: os.length,
    ActiveOrders: os.filter(o => o.Status === 'Active').length,
    BalanceDue: sum(os, 'RemainingPayment')
  };
}
/* ---------- local state patches (avoid a full reload after every edit) ---------- */
function patchOrder(updated) {
  const i = state.orders.findIndex(x => x._id === updated._id);
  if (i > -1) state.orders[i] = updated; else state.orders.unshift(updated);
  render();
}
function removeOrder(id) {
  state.orders = state.orders.filter(x => x._id !== id);
  render();
}
function patchClient(updated) {
  const i = state.clients.findIndex(x => x._id === updated._id);
  if (i > -1) state.clients[i] = { ...state.clients[i], ...updated }; else state.clients.push(updated);
  render();
}
function removeClient(id) {
  state.clients = state.clients.filter(x => x._id !== id);
  render();
}

/* ---------- auth ---------- */
let authMode = 'login';
function setAuthMode(mode) {
  authMode = mode;
  const login = mode === 'login';
  $('#authTitle').textContent = login ? 'Log in' : 'Create account';
  $('#authBtn').textContent = login ? 'Log in' : 'Create account';
  $('#authSwitchText').textContent = login ? 'Need an admin account?' : 'Already have an account?';
  $('#authSwitch').textContent = login ? 'Create account' : 'Log in';
  $('#ap').autocomplete = login ? 'current-password' : 'new-password';
  $('#authErr').textContent = '';
}
$('#authSwitch').onclick = () => setAuthMode(authMode === 'login' ? 'signup' : 'login');

$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const username = $('#au').value.trim(), password = $('#ap').value, btn = $('#authBtn');
  btn.disabled = true; $('#authErr').textContent = '';
  try {
    if (authMode === 'signup') await api('/signup', 'POST', { username, password });
    const r = await api('/login', 'POST', { username, password });
    authToken = r.token;
    localStorage.setItem('odToken', r.token);
    localStorage.setItem('odUsername', r.username);
    localStorage.setItem('odUserId', r.id || '');
    localStorage.setItem('odRole', r.role);
    $('#authForm').reset();
    showApp();
  } catch (err) { $('#authErr').textContent = err.message; }
  finally { btn.disabled = false; }
});

function doLogout() {
  authToken = null;
  localStorage.removeItem('odToken');
  localStorage.removeItem('odUsername');
  localStorage.removeItem('odUserId');
  localStorage.removeItem('odRole');
  $('#app').hidden = true; $('#auth').hidden = false;
  document.body.classList.remove('nav-open');
  setAuthMode('login');
}
$('#logout').onclick = doLogout;

function showApp() {
  $('#auth').hidden = true; $('#app').hidden = false;
  const n = localStorage.getItem('odUsername') || 'Admin';
  state.role = localStorage.getItem('odRole') || 'admin';
  $('#whoName').textContent = n; $('#whoAv').textContent = (n[0] || 'A').toUpperCase();
  const roleLabel = $('#whoRole'); if (roleLabel) roleLabel.textContent = state.role === 'admin' ? 'Administrator' : 'Worker';
  state.view = 'dashboard';
  loadAll();
}

/* ---------- data ---------- */
async function loadAll() {
  $('#view').innerHTML = '<p class="muted">Loading…</p>';
  try {
    const [orders, clients, products, team] = await Promise.all([
      api('/orders'), api('/allclients'), api('/products'),
      state.role === 'admin' ? api('/team') : Promise.resolve([])
    ]);
    state.orders = orders.slice().reverse();
    state.clients = clients;
    state.products = products;
    state.team = team;
    render();
    if (pendingOrderId) {
      const id = pendingOrderId; pendingOrderId = null;
      history.replaceState(null, '', location.pathname);
      if (state.orders.some(o => o._id === id)) { state.view = 'orders'; render(); openOrderActions(id); }
      else toast('That order could not be found');
    }
  } catch (err) {
    $('#view').innerHTML = `<div class="card empty"><p>${esc(err.message)}</p><button class="btn" id="retry">Try again</button></div>`;
    $('#retry').onclick = loadAll;
  }
}

/* ---------- nav ---------- */
const ADMIN_ONLY_VIEWS = ['trash', 'team', 'quotes', 'employees'];
function go(view) {
  if (ADMIN_ONLY_VIEWS.includes(view) && state.role !== 'admin') view = 'dashboard';
  state.view = view; state.q = ''; state.filter = 'All';
  if (view === 'orders' && state.role !== 'admin') state.filter = 'My jobs';
  document.body.classList.remove('nav-open');
  render(); window.scrollTo(0, 0);
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if (b) go(b.dataset.view); });
$('#menuBtn').onclick = () => document.body.classList.add('nav-open');
$('#scrim').onclick = () => document.body.classList.remove('nav-open');
document.addEventListener('click', e => { const g = e.target.closest('[data-goto]'); if (g) go(g.dataset.goto); });
document.addEventListener('click', e => { const r = e.target.closest('[data-remind-client]'); if (r) { e.preventDefault(); e.stopPropagation(); remindClient(r.dataset.remindClient); } });

function applyRoleUI() {
  const isAdmin = state.role === 'admin';
  document.querySelectorAll('[data-admin-only]').forEach(el => { el.hidden = !isAdmin; });
}
function render() {
  applyRoleUI();
  document.querySelectorAll('#nav button').forEach(b => {
    if (b.dataset.view === state.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  ({ dashboard: viewDashboard, orders: viewOrders, clients: viewClients, products: viewProducts, trash: viewTrash, team: viewTeam, quotes: viewQuotes, employees: viewEmployees })[state.view]();
  paintIcons($('#view'));
  const v = $('#view');
  v.classList.remove('view-enter'); void v.offsetWidth; v.classList.add('view-enter');
}

/* ================= DASHBOARD ================= */
function viewDashboard() {
  const isAdmin = state.role === 'admin';
  const o = state.orders, c = state.clients;
  const active = o.filter(x => x.Status === 'Active');
  const total = sum(o, 'TotalValue'), due = sum(o, 'RemainingPayment'), collected = Math.max(total - due, 0);
  const pct = total ? Math.round(collected / total * 100) : 0;
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const overdue = active.filter(x => ts(x.DeliveryDate) < t0.getTime()).length;
  const upcoming = active.slice().sort((a, b) => ts(a.DeliveryDate) - ts(b.DeliveryDate)).slice(0, 5);
  const topDue = c.map(x => ({ ...x, ...clientStats(x._id) })).filter(x => x.BalanceDue > 0).sort((a, b) => b.BalanceDue - a.BalanceDue).slice(0, 5);
  const recent = o.slice(0, 5);
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const name = localStorage.getItem('odUsername') || 'Admin';

  if (isAdmin && !c.length) {
    $('#view').innerHTML = `
      <div class="head"><div><h1 class="title">${greet}, ${esc(name)}</h1><p>Let's get Order Desk set up.</p></div></div>
      <div class="card" style="text-align:center;padding:48px 24px">
        <div class="ic" data-icon="clients" style="margin:0 auto 16px;width:48px;height:48px;border-radius:14px"></div>
        <h3 style="font-size:18px;margin:0 0 6px">Add your first client</h3>
        <p class="muted" style="margin:0 0 20px;max-width:340px;margin-left:auto;margin-right:auto">Orders belong to a client, so that's the first thing to set up. Add one, then create your first order.</p>
        <button class="btn primary" id="addFirstClient" style="margin:0 auto"><span data-icon="plus"></span>Add a client</button>
      </div>`;
    $('#addFirstClient').onclick = openClientForm;
    paintIcons($('#view'));
    return;
  }

  $('#view').innerHTML = `
    <div class="head">
      <div><h1 class="title">${greet}, ${esc(name)}</h1><p>${new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p></div>
      ${isAdmin ? `<button class="btn primary" id="add"><span data-icon="plus"></span>New order</button>` : ''}
    </div>

    <div class="stats">
      <div class="card stat hero"><div class="ic" data-icon="orders"></div><span class="l">Active orders</span><strong>${active.length}</strong><small>${overdue ? overdue + ' past delivery date' : 'All on schedule'}</small></div>
      ${isAdmin ? `<div class="card stat"><div class="ic" data-icon="wallet"></div><span class="l">Balance due</span><strong>${money(due)}</strong><small>Across ${o.filter(x => x.RemainingPayment > 0).length} orders</small></div>
      <div class="card stat"><div class="ic" data-icon="trend"></div><span class="l">Total order value</span><strong>${money(total)}</strong><small>${o.length} orders in total</small></div>
      <div class="card stat"><div class="ic" data-icon="wallet"></div><span class="l">Estimated profit</span><strong>${money(o.reduce((t, x) => t + orderProfit(x), 0))}</strong><small>Total value minus cost &amp; expenses</small></div>` : `<div class="card stat"><div class="ic" data-icon="trend"></div><span class="l">My active jobs</span><strong>${active.filter(x => x.AssignedTo && x.AssignedTo === myId()).length}</strong><small>Assigned to you</small></div>`}
      <div class="card stat"><div class="ic" data-icon="clients"></div><span class="l">Clients</span><strong>${c.length}</strong><small>${state.products.length} products listed</small></div>
    </div>

    ${isAdmin ? `<div class="grid2">
      <div class="card chart"><div class="card-head"><h3>Order value by month</h3><span class="muted" style="font-size:13px">Last 6 months</span></div>${monthChart()}</div>
      <div class="card"><div class="card-head"><h3>Payments</h3></div>
        <div class="donut-wrap">
          <div class="donut">
            <svg viewBox="0 0 140 140"><circle class="track" cx="70" cy="70" r="54" fill="none" stroke-width="14"/><circle class="val" cx="70" cy="70" r="54" fill="none" stroke-width="14" stroke-dasharray="${(pct * 339.29 / 100).toFixed(1)} 339.29"/></svg>
            <div class="mid"><div>${pct}%<small>collected</small></div></div>
          </div>
          <div class="legend">
            <div><i></i><span style="color:var(--ink);font-size:14px"><strong>${money(collected)}</strong><span>Received</span></span></div>
            <div><i class="b"></i><span style="color:var(--ink);font-size:14px"><strong>${money(due)}</strong><span>Still due</span></span></div>
          </div>

function dueBadge(x, t0) {
  const d = ts(x.DeliveryDate);
  if (!isFinite(d)) return '';
  const days = Math.round((d - t0.getTime()) / 864e5);
  if (days < 0) return `<span class="pill late">${-days}d overdue</span>`;
  if (days === 0) return '<span class="pill">Due today</span>';
  if (days === 1) return '<span class="pill">Tomorrow</span>';
  return `<span class="pill">In ${days} days</span>`;
}
function monthChart() {
  const now = new Date(), months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ y: d.getFullYear(), m: d.getMonth(), label: d.toLocaleDateString('en-IN', { month: 'short' }), v: 0 });
  }
  state.orders.forEach(x => {
    const d = parseDate(x.ReceivingDate); if (isNaN(d)) return;
    const slot = months.find(k => k.y === d.getFullYear() && k.m === d.getMonth());
    if (slot) slot.v += Number(x.TotalValue) || 0;
  });
  const max = Math.max(...months.map(k => k.v), 1);
  if (!months.some(k => k.v > 0)) return '<div class="empty sm">Order value will appear here once you have orders.</div>';
  const W = 480, H = 210, top = 24, bottom = 28, slotW = W / 6, bw = 40, ch = H - top - bottom;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Order value for the last six months">
    <line x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}" stroke="#e1e7e3"/>
    ${months.map((k, i) => {
      const h = k.v ? Math.max(k.v / max * ch, 4) : 0, x = i * slotW + (slotW - bw) / 2, y = H - bottom - h;
      return `${k.v ? `<rect class="bar ${i === 5 ? 'now' : ''}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="6"/><text class="v" x="${x + bw / 2}" y="${y - 7}" text-anchor="middle">₹${compact(k.v)}</text>` : ''}
        <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${k.label}</text>`;
    }).join('')}</svg>`;
}

function csvEscape(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows, headers) {
  const lines = [headers.map(h => csvEscape(h.label)).join(',')];
  rows.forEach(r => lines.push(headers.map(h => csvEscape(h.get(r))).join(',')));
  return lines.join('\r\n');
}
async function downloadCSV(content, filename) {
  const blob = new Blob(['\ufeff' + content], { type: 'text/csv;charset=utf-8;' });
  // On phones — especially the installed Android app's WebView — a plain
  // blob-download link often finishes with nowhere visible to find the
  // file. The native share sheet (Save to Files, Drive, email, WhatsApp…)
  // is far more reliable there, so prefer it when available.
  if (navigator.canShare && navigator.share) {
    try {
      const file = new File([blob], filename, { type: 'text/csv' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return 'shared';
      }
    } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return 'downloaded';
}

        const r = await api(`/orders/${encodeURIComponent(o._id)}/photos`, 'POST', { url });
        o = r.order;
        patchOrder(r.order);
        toast('Photo added');
        render();
      } catch (err) { toast(err.message || 'Could not add photo'); }
    };
    dlg.querySelectorAll('.photo-del').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('Remove this photo?')) return;
        try {
          const r = await api(`/orders/${encodeURIComponent(o._id)}/photos/${btn.dataset.pid}`, 'DELETE');
          o = r.order;
          patchOrder(r.order);
          render();
        } catch (err) { toast(err.message); }
      };
    });
  };
  render();
  dlg.showModal();
}

function openOrderActions(id) {

      <button type="button" class="sheet-item" id="histBtn">View order history</button>
      <button type="button" class="sheet-item danger" id="delBtn">Delete order</button>` : ''}
    </div>
    <div class="actions"><button type="button" class="btn" id="cancel">Close</button></div>`;
  $('#cancel').onclick = () => dlg.close();
  $('#photosBtn').onclick = () => { dlg.close(); openOrderPhotos(o); };
  $('#updBtn').onclick = () => { dlg.close(); sendStageUpdate(o); };
  const assignSel = $('#ordAssign');
  if (assignSel) assignSel.onchange = async e => {
    try {
      const r = await api(`/orders/${encodeURIComponent(o._id)}/assign`, 'PATCH', { AssignedTo: e.target.value });
      toast(r.order.AssignedName ? `${orderTitle(o)} assigned to ${r.order.AssignedName}` : `${orderTitle(o)} unassigned`);
      dlg.close();
      patchOrder(r.order);
    } catch (err) { toast(err.message); e.target.value = o.AssignedTo || ''; }
  };
  const editBtn = $('#editBtn'); if (editBtn) editBtn.onclick = () => { dlg.close(); editOrderForm(o); };
  const expBtn = $('#expBtn'); if (expBtn) expBtn.onclick = () => { dlg.close(); openOrderExpenses(o); };
  const advBtn = $('#advBtn'); if (advBtn) advBtn.onclick = () => { dlg.close(); addAdvanceForm(o); };
  const remindBtn = $('#remindBtn'); if (remindBtn) remindBtn.onclick = () => { dlg.close(); remindOrder(o); };
  const histBtn = $('#histBtn'); if (histBtn) histBtn.onclick = () => { dlg.close(); openOrderHistory(o); };
  const delBtn = $('#delBtn'); if (delBtn) delBtn.onclick = () => { dlg.close(); deleteOrder(o); };

  // Dropdowns apply immediately on change — no separate submit step, and
  // only the affected order is patched into local state (no full reload).
  // Status and Stage both stay freely editable at any time, even after
  // Closed — nothing here ever locks.
  $('#ordStatus').onchange = async e => {
    const val = e.target.value;
    if (val === o.Status) return;
    let markPaid = false;
    if (val === 'Closed' && o.RemainingPayment > 0) {
      markPaid = confirm(`${clientName(o.Client)} still owes ${money(o.RemainingPayment)}. Mark it as received too? (If not, this will be marked "Payment Due" instead of Closed.)`);
    }
    try {
      const r = await api(`/orders/${encodeURIComponent(o._id)}/status`, 'PATCH', { Status: val, markPaid });
      toast(`${orderTitle(o)} is now ${r.order.Status}`);
      dlg.close();
      patchOrder(r.order);
    } catch (err) { toast(err.message); e.target.value = o.Status; }
  };
  $('#ordStage').onchange = async e => {
    const step = +e.target.value;
    if (step === o.Stage) return;
    try {
      const r = await api(`/orders/${encodeURIComponent(o._id)}/stage`, 'PATCH', { Stage: step });
      toast(`${orderTitle(o)} moved to "${STAGES[step - 1]}"${r.order.Status !== o.Status ? ` · now ${r.order.Status}` : ''}`);
      dlg.close();
      patchOrder(r.order);
      if (step >= STAGES.length - 1 && step < STAGES.length) offerClientUpdate(r.order);
    } catch (err) { toast(err.message); e.target.value = o.Stage; }
  };
  dlg.showModal();
}

/* ================= RECENTLY DELETED ================= */
async function viewTrash() {
  $('#view').innerHTML = `
    <div class="head"><div><h1 class="title">Recently deleted</h1><p>Restore an order or client, or remove it for good.</p></div></div>
    <div class="empty" style="margin-top:12px"><p>Loading…</p></div>`;
  try {
    const [delOrders, delClients, delEmployees] = await Promise.all([
      api('/orders/deleted'),
      api('/clients/deleted'),
      api('/employees/deleted')
    ]);
    state.deletedOrders = delOrders;
    state.deletedClients = delClients;
    state.deletedEmployees = delEmployees;
    renderTrash();
  } catch (err) {
    $('#view').innerHTML += `<div class="card empty"><p>${esc(err.message)}</p></div>`;
  }
}
function renderTrash() {
  const dOrders = state.deletedOrders || [];
  const dClients = state.deletedClients || [];
  const findAnyClientName = id => (state.clients.find(c => c._id === id) || state.deletedClients.find(c => c._id === id) || {}).name || 'Unknown client';
  $('#view').innerHTML = `
    <div class="head"><div><h1 class="title">Recently deleted</h1><p>Restore an order or client, or remove it for good.</p></div></div>
    <h3 class="section-title">Deleted orders (${dOrders.length})</h3>
    ${dOrders.length ? `<div class="wrap"><table>
      <thead><tr><th>Order</th><th>Client</th><th>Type</th><th class="num">Total</th><th>Deleted</th><th></th></tr></thead>
      <tbody>${dOrders.map(o => `<tr>
        <td class="strong">${esc(orderTitle(o))}</td>
        <td>${esc(findAnyClientName(o.Client))}</td>
        <td>${typePill(o.OrderType)}</td>
        <td class="num">${money(o.TotalValue)}</td>
        <td>${fmtDate(o.DeletedAt)}</td>
        <td class="num" style="white-space:nowrap">
          <button class="btn sm" data-restore-order="${esc(o._id)}">Restore</button>
          <button class="btn sm" data-purge-order="${esc(o._id)}">Delete forever</button>
        </td></tr>`).join('')}</tbody></table></div>`
      : '<div class="wrap"><div class="empty"><p>No deleted orders.</p></div></div>'}
    <h3 class="section-title">Deleted clients (${dClients.length})</h3>
    ${dClients.length ? `<div class="wrap"><table>
      <thead><tr><th>Name</th><th>Phone</th><th>Deleted</th><th></th></tr></thead>
      <tbody>${dClients.map(c => `<tr>
        <td class="strong">${esc(c.name)}</td><td>${esc(c.Phone)}</td><td>${fmtDate(c.DeletedAt)}</td>
        <td class="num" style="white-space:nowrap">
          <button class="btn sm" data-restore-client="${esc(c._id)}">Restore</button>
          <button class="btn sm" data-purge-client="${esc(c._id)}">Delete forever</button>
        </td></tr>`).join('')}</tbody></table></div>`
      : '<div class="wrap"><div class="empty"><p>No deleted clients.</p></div></div>'}
    <h3 class="section-title">Deleted employees (${(state.deletedEmployees || []).length})</h3>
    ${(state.deletedEmployees || []).length ? `<div class="wrap"><table>
      <thead><tr><th>Name</th><th>Role</th><th>Deleted</th><th></th></tr></thead>
      <tbody>${state.deletedEmployees.map(emp => `<tr>
        <td class="strong">${esc(emp.name)}</td><td>${emp.Role ? esc(emp.Role) : '<span class="muted">—</span>'}</td><td>${fmtDate(emp.DeletedAt)}</td>
        <td class="num" style="white-space:nowrap">
          <button class="btn sm" data-restore-employee="${esc(emp._id)}">Restore</button>
          <button class="btn sm" data-purge-employee="${esc(emp._id)}">Delete forever</button>
        </td></tr>`).join('')}</tbody></table></div>`
      : '<div class="wrap"><div class="empty"><p>No deleted employees.</p></div></div>'}`;

  $('#view').onclick = async e => {
    const ro = e.target.closest('[data-restore-order]');
    const po = e.target.closest('[data-purge-order]');
    const rc = e.target.closest('[data-restore-client]');
    const pc = e.target.closest('[data-purge-client]');
    const re = e.target.closest('[data-restore-employee]');
    const pe = e.target.closest('[data-purge-employee]');

    if (ro) {
      try {
        const r = await api(`/orders/${encodeURIComponent(ro.dataset.restoreOrder)}/restore`, 'POST');
        state.orders.unshift(r.order);
        state.deletedOrders = state.deletedOrders.filter(x => x._id !== r.order._id);
        toast(`${orderTitle(r.order)} restored`);
        renderTrash();
      } catch (err) { toast(err.message); }
    } else if (po) {
      if (!confirm('Permanently delete this order? This cannot be undone.')) return;
      try {
        await api(`/orders/${encodeURIComponent(po.dataset.purgeOrder)}/forever`, 'DELETE');
        state.deletedOrders = state.deletedOrders.filter(x => x._id !== po.dataset.purgeOrder);
        toast('Order permanently deleted');
        renderTrash();
      } catch (err) { toast(err.message); }
    } else if (rc) {
      try {
        const r = await api(`/clients/${encodeURIComponent(rc.dataset.restoreClient)}/restore`, 'POST');
        state.clients.push(r.client);
        state.deletedClients = state.deletedClients.filter(x => x._id !== r.client._id);
        toast(`${r.client.name} restored`);
        renderTrash();
      } catch (err) { toast(err.message); }
    } else if (pc) {
      if (!confirm('Permanently delete this client? This cannot be undone.')) return;
      try {
        await api(`/clients/${encodeURIComponent(pc.dataset.purgeClient)}/forever`, 'DELETE');
        state.deletedClients = state.deletedClients.filter(x => x._id !== pc.dataset.purgeClient);
        toast('Client permanently deleted');
        renderTrash();
      } catch (err) { toast(err.message); }
    } else if (re) {
      try {
        const r = await api(`/employees/${encodeURIComponent(re.dataset.restoreEmployee)}/restore`, 'POST');
        state.deletedEmployees = state.deletedEmployees.filter(x => x._id !== r.employee._id);
        toast(`${r.employee.name} restored`);
        renderTrash();
      } catch (err) { toast(err.message); }
    } else if (pe) {
      if (!confirm('Permanently delete this employee? This cannot be undone.')) return;
      try {
        await api(`/employees/${encodeURIComponent(pe.dataset.purgeEmployee)}/forever`, 'DELETE');
        state.deletedEmployees = state.deletedEmployees.filter(x => x._id !== pe.dataset.purgeEmployee);
        toast('Employee permanently deleted');
        renderTrash();
      } catch (err) { toast(err.message); }
    }
  };
  paintIcons($('#view'));
}

/* ================= EMPLOYEES (admin only) ================= */
const ATT_STATUSES = ['Present', 'Absent', 'Half Day', 'Leave'];
const ATT_SHORT = { 'Present': 'P', 'Absent': 'A', 'Half Day': 'H', 'Leave': 'L' };
function monthLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
}
function salaryLabel(emp) { return emp.SalaryType === 'Daily' ? `${money(emp.SalaryAmount)}/day` : `${money(emp.SalaryAmount)}/month`; }
// Salary math (gross, per-day deduction for Absent/Half Day, net, due) is
// computed server-side so the list, the attendance tab, and the payment
// form never disagree. This just looks up what the server last computed.
const summaryFor = id => (state.salarySummary || []).find(s => s.EmployeeId === id);
function daysInMonthClient(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
async function ensureSalarySummary(ym) {
  if (state.salarySummaryMonth === ym && state.salarySummary) return;
  try {
    state.salarySummary = await api(`/employees/summary?month=${encodeURIComponent(ym)}`);
    state.salarySummaryMonth = ym;
  } catch (err) { toast(err.message); state.salarySummary = []; }
}
async function ensureSalarySummaryForce(ym) { state.salarySummaryMonth = null; await ensureSalarySummary(ym); }

async function viewEmployees() {
  state.empTab = state.empTab || 'list';
  $('#view').innerHTML = `
    <div class="head"><div><h1 class="title">Employees</h1><p>Loading…</p></div></div>`;
  try {
    state.employees = await api('/employees');
    if (state.empTab === 'attendance') await loadAttendanceMonth(state.attMonth);
    else await ensureSalarySummary(today().slice(0, 7));
    renderEmployees();
  } catch (err) {
    $('#view').innerHTML += `<div class="card empty"><p>${esc(err.message)}</p></div>`;
  }
}
async function loadAttendanceMonth(ym) {
  state.attMonth = ym;
  try {
    const [recs] = await Promise.all([
      api(`/attendance?month=${encodeURIComponent(ym)}`),
      ensureSalarySummary(ym)
    ]);
    state.attendance = recs;
  } catch (err) { toast(err.message); state.attendance = []; }
}
function renderEmployees() {
  const activeEmps = state.employees.filter(e => e.Active !== false);
  $('#view').innerHTML = `
    <div class="head"><div><h1 class="title">Employees</h1><p>${state.employees.length} on record, ${activeEmps.length} active</p></div>
      ${state.empTab === 'list' ? `<button class="btn primary" id="add"><span data-icon="plus"></span>New employee</button>` : ''}</div>
    <div class="seg" id="empSeg">${['list', 'attendance'].map(t => `<button data-t="${t}" aria-pressed="${state.empTab === t}">${t === 'list' ? 'Employees' : 'Attendance'}</button>`).join('')}</div>
    <div id="empBody" style="margin-top:16px"></div>`;
  $('#empSeg').onclick = e => {
    const b = e.target.closest('button'); if (!b || b.dataset.t === state.empTab) return;
    state.empTab = b.dataset.t;
    const ready = state.empTab === 'attendance' ? loadAttendanceMonth(state.attMonth) : ensureSalarySummary(today().slice(0, 7));
    ready.then(renderEmployees);
  };
  const addBtn = $('#add'); if (addBtn) addBtn.onclick = () => openEmployeeForm();
  if (state.empTab === 'list') renderEmployeeList(); else renderAttendance();
  paintIcons($('#view'));
}

function renderEmployeeList() {
  const ym = today().slice(0, 7);
  const rows = state.employees;
  $('#empBody').innerHTML = rows.length ? `<div class="wrap"><table>
    <thead><tr><th>Employee</th><th>Role</th><th>Phone</th><th class="num">Salary</th><th class="num">Deduction</th><th class="num">Paid (${monthLabel(ym)})</th><th class="num">Due</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows.map(e => {
      const s = summaryFor(e._id);
      return `<tr>
      <td class="strong">${esc(e.name)}<br><span class="muted" style="font-weight:400;font-size:12px">${esc(e.EmployeeID)}</span></td>
      <td>${e.Role ? esc(e.Role) : '<span class="muted">—</span>'}</td>
      <td>${e.Phone ? esc(e.Phone) : '<span class="muted">—</span>'}</td>
      <td class="num">${salaryLabel(e)}</td>
      <td class="num">${s && s.deduction ? `<span class="muted">−${money(s.deduction)}</span>` : '<span class="muted">—</span>'}</td>
      <td class="num">${money(s ? s.paid : 0)}</td>
      <td class="num">${s ? money(s.due) : '<span class="muted">—</span>'}</td>
      <td>${e.Active === false ? '<span class="pill late">Inactive</span>' : '<span class="pill">Active</span>'}</td>
      <td class="num"><button class="btn sm" data-emp-actions="${esc(e._id)}">Actions</button></td>
    </tr>`;
    }).join('')}</tbody></table></div>`
    : '<div class="wrap"><div class="empty"><p>No employees yet. Add your first one.</p></div></div>';
  $('#empBody').onclick = e => { const b = e.target.closest('[data-emp-actions]'); if (b) openEmployeeActions(b.dataset.empActions); };
}

function renderAttendance() {
  const activeEmps = state.employees.filter(e => e.Active !== false);
  const date = state.attDate || today();
  const ym = date.slice(0, 7);
  if (ym !== state.attMonth) { loadAttendanceMonth(ym).then(renderAttendance); return; }
  const byDate = id => (state.attendance.find(a => a.Employee === id && a.Date === date) || {}).Status;
  $('#empBody').innerHTML = `
    <div class="field" style="max-width:220px"><label for="attDate">Date</label><input id="attDate" type="date" value="${esc(date)}" max="${today()}"></div>
    <h3 class="section-title">Mark attendance — ${fmtDate(date)}</h3>
    ${activeEmps.length ? `<div class="wrap"><table>
      <thead><tr><th>Employee</th><th>Role</th><th colspan="4">Status</th></tr></thead>
      <tbody>${activeEmps.map(e => {
        const current = byDate(e._id);
        return `<tr><td class="strong">${esc(e.name)}</td><td>${e.Role ? esc(e.Role) : '<span class="muted">—</span>'}</td>
          ${ATT_STATUSES.map(s => `<td class="num"><button type="button" class="btn sm${current === s ? ' primary' : ''}" data-mark="${esc(e._id)}" data-status="${s}">${ATT_SHORT[s]}</button></td>`).join('')}
        </tr>`;
      }).join('')}</tbody></table></div>` : '<div class="wrap"><div class="empty"><p>No active employees to mark.</p></div></div>'}
    <h3 class="section-title">Monthly summary & salary — ${monthLabel(ym)}</h3>
    <p class="muted" style="margin-top:-6px">Per day = salary ÷ ${daysInMonthClient(ym)} days this month. Absent deducts a full day, Half Day deducts half. Leave is paid.</p>
    ${activeEmps.length ? `<div class="wrap"><table>
      <thead><tr><th>Employee</th>${ATT_STATUSES.map(s => `<th class="num">${s}</th>`).join('')}<th class="num">Deduction</th><th class="num">Net salary</th><th class="num">Due</th></tr></thead>
      <tbody>${activeEmps.map(e => {
        const recs = state.attendance.filter(a => a.Employee === e._id);
        const counts = Object.fromEntries(ATT_STATUSES.map(s => [s, recs.filter(r => r.Status === s).length]));
        const s = summaryFor(e._id);
        return `<tr><td class="strong">${esc(e.name)}</td>${ATT_STATUSES.map(st => `<td class="num">${counts[st]}</td>`).join('')}
          <td class="num">${s && s.deduction ? `−${money(s.deduction)}` : '<span class="muted">—</span>'}</td>
          <td class="num">${s ? money(s.netSalary) : '<span class="muted">—</span>'}</td>
          <td class="num">${s ? money(s.due) : '<span class="muted">—</span>'}</td></tr>`;
      }).join('')}</tbody></table></div>` : ''}`;
  $('#attDate').onchange = e => { state.attDate = e.target.value; renderAttendance(); };
  $('#empBody').onclick = async e => {
    const b = e.target.closest('[data-mark]'); if (!b) return;
    const empId = b.dataset.mark, status = b.dataset.status;
    try {
      const r = await api('/attendance', 'POST', { Employee: empId, Date: date, Status: status });
      const i = state.attendance.findIndex(a => a.Employee === empId && a.Date === date);
      if (i > -1) state.attendance[i] = r.record; else state.attendance.push(r.record);
      await ensureSalarySummaryForce(ym);
      renderAttendance();
    } catch (err) { toast(err.message); }
  };
}

function openEmployeeForm(existing) {

  const fields = `
    <div class="field"><label for="name">Name</label><input id="name" name="name" value="${isEdit ? esc(existing.name) : ''}" required></div>

      <div class="field"><label for="Role">Role / designation</label><input id="Role" name="Role" placeholder="e.g. Machine Operator" value="${isEdit ? esc(existing.Role || '') : ''}"></div>

    </div>

      <div class="field"><label for="SalaryType">Salary type</label>
        <select id="SalaryType" name="SalaryType"><option value="Monthly" ${isEdit && existing.SalaryType === 'Monthly' ? 'selected' : ''}>Monthly</option><option value="Daily" ${isEdit && existing.SalaryType === 'Daily' ? 'selected' : ''}>Daily wage</option></select></div>
      <div class="field"><label for="SalaryAmount">Amount (₹)</label><input id="SalaryAmount" name="SalaryAmount" type="number" min="0" step="any" inputmode="decimal" value="${isEdit ? existing.SalaryAmount : ''}" required></div>
    </div>

function openEmployeeActions(id) {
  const emp = state.employees.find(x => x._id === id);
  if (!emp) return;
  const s = summaryFor(id);
  const dlg = $('#dlg');
  dlg.innerHTML = `<h2>${esc(emp.name)}</h2>
    <p class="muted" style="margin-top:-14px;margin-bottom:18px">${esc(emp.EmployeeID)}${emp.Role ? ` · ${esc(emp.Role)}` : ''} · ${salaryLabel(emp)}${s ? ` · Due ${money(s.due)}` : ''}</p>

      <button type="button" class="sheet-item" id="toggleActiveBtn">${emp.Active === false ? 'Mark active' : 'Mark inactive'}</button>

function openSalaryForm(emp) {
  const ym = today().slice(0, 7);
  const s = summaryFor(emp._id);
  const fields = `
    <p class="calc" style="margin-top:0">${salaryLabel(emp)}${s ? ` · Net for ${monthLabel(ym)}: ${money(s.netSalary)}${s.deduction ? ` (after −${money(s.deduction)} deduction)` : ''} · Due: <strong>${money(s.due)}</strong>` : ''}</p>
    <div class="two">
      <div class="field"><label for="forMonth">For month</label><input id="forMonth" name="forMonth" type="month" value="${ym}" required></div>
      <div class="field"><label for="amount">Amount (₹)</label><input id="amount" name="amount" type="number" min="0" step="any" inputmode="decimal" value="${s && s.due > 0 ? s.due : ''}" required></div>
    </div>
    <div class="two">
      <div class="field"><label for="mode">Mode</label>
        <select id="mode" name="mode"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Cheque</option></select></div>
      <div class="field"><label for="date">Date</label><input id="date" name="date" type="date" value="${today()}" required></div>
    </div>`;
  openForm(`Salary — ${emp.name}`, fields, 'Record payment', async d => {
    const amt = +d.amount;
    if (!amt || amt <= 0) throw new Error('Enter a valid amount.');
    const r = await api(`/employees/${encodeURIComponent(emp._id)}/salary`, 'POST', d);
    await ensureSalarySummaryForce(state.empTab === 'attendance' ? state.attMonth : today().slice(0, 7));
    toast(`${money(amt)} recorded for ${emp.name}`);
    const i = state.employees.findIndex(x => x._id === r.employee._id);
    if (i > -1) state.employees[i] = r.employee;
    renderEmployees();
  });
}

function deleteEmployee(emp) {
  if (!confirm(`Delete ${emp.name}? This can be undone from Recently Deleted.`)) return;
  api(`/employees/${encodeURIComponent(emp._id)}`, 'DELETE')
    .then(() => { state.employees = state.employees.filter(x => x._id !== emp._id); toast(`${emp.name} deleted`); renderEmployees(); })
    .catch(err => toast(err.message));
}

/* ================= QUOTATIONS (admin only) ================= */
const QUOTE_STATUSES = ['Draft', 'Sent', 'Accepted', 'Rejected'];
function quoteName(q) { return (q.ProspectName || clientName(q.Client)) || 'Unknown'; }
function quotePill(status) {
  const cls = status === 'Accepted' ? 'done' : status === 'Rejected' ? 'late' : status === 'Converted' ? 'type-new' : '';
  return `<span class="pill ${cls}">${esc(status)}</span>`;
}
async function viewQuotes() {
  $('#view').innerHTML = `
    <div class="head"><div><h1 class="title">Quotations</h1><p>Quote a job, then convert it into an order once it's accepted.</p></div></div>
    <div class="empty" style="margin-top:12px"><p>Loading…</p></div>`;
  try {
    state.quotes = await api('/quotes');
    renderQuotes();
  } catch (err) {
    $('#view').innerHTML += `<div class="card empty"><p>${esc(err.message)}</p></div>`;
  }
}
function renderQuotes() {
  const rows = state.quotes;
  $('#view').innerHTML = `
    <div class="head"><div><h1 class="title">Quotations</h1><p>${rows.length} on record</p></div>
      <button class="btn primary" id="add"><span data-icon="plus"></span>New quotation</button></div>
    ${rows.length ? `<div class="wrap"><table>
      <thead><tr><th>Quote</th><th>For</th><th class="num">Amount</th><th>Valid until</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows.map(q => `<tr>
        <td class="strong">${esc(q.QuoteID)}</td>
        <td>${esc(quoteName(q))}</td>
        <td class="num">${money(q.Amount)}</td>
        <td>${q.ValidUntil ? fmtDate(q.ValidUntil) : '<span class="muted">—</span>'}</td>
        <td>${quotePill(q.Status)}</td>
        <td class="num"><button class="btn sm" data-quote-actions="${esc(q._id)}">Actions</button></td>
      </tr>`).join('')}</tbody></table></div>`
      : '<div class="wrap"><div class="empty"><p>No quotations yet. Create one to send to a prospect or client.</p></div></div>'}`;
  $('#add').onclick = () => openQuoteForm();
  $('#view').onclick = e => { const b = e.target.closest('[data-quote-actions]'); if (b) openQuoteActions(b.dataset.quoteActions); };
  paintIcons($('#view'));
}

function openQuoteForm(existing) {
  const isEdit = !!existing;
  const fields = `
    ${isEdit ? '' : `<div class="field"><label for="Client">Client</label>
      <select id="Client" name="Client">
        <option value="">— New prospect (not a client yet) —</option>
        ${state.clients.map(c => `<option value="${esc(c._id)}">${esc(c.name)} (${esc(c.Phone)})</option>`).join('')}
      </select></div>
    <div class="two" id="prospectFields">
      <div class="field"><label for="ProspectName">Prospect name</label><input id="ProspectName" name="ProspectName"></div>
      <div class="field"><label for="ProspectPhone">Phone</label><input id="ProspectPhone" name="ProspectPhone"></div>
    </div>`}
    <div class="field"><label for="Description">What's being quoted</label><input id="Description" name="Description" value="${isEdit ? esc(existing.Description || '') : ''}" required></div>
    <div class="two">
      <div class="field"><label for="Amount">Amount (₹)</label><input id="Amount" name="Amount" type="number" min="0" step="any" inputmode="decimal" value="${isEdit ? existing.Amount : ''}" required></div>
      <div class="field"><label for="ValidUntil">Valid until</label><input id="ValidUntil" name="ValidUntil" type="date" value="${isEdit ? esc(existing.ValidUntil || '') : addDays(14)}"></div>
    </div>`;
  openForm(isEdit ? `Edit ${existing.QuoteID}` : 'New quotation', fields, isEdit ? 'Save changes' : 'Create quotation', async d => {
    if (isEdit) {
      const r = await api(`/quotes/${encodeURIComponent(existing._id)}`, 'PATCH', d);
      toast(`${existing.QuoteID} updated`);
      const i = state.quotes.findIndex(x => x._id === r.quote._id);
      if (i > -1) state.quotes[i] = r.quote;
    } else {
      if (!d.Client && !d.ProspectName) throw new Error("Pick a client or enter a prospect's name.");
      const r = await api('/quotes', 'POST', d);
      toast(`Quotation ${r.quote.QuoteID} created`);
      state.quotes.unshift(r.quote);
    }
    renderQuotes();
  }, isEdit ? null : () => {
    const sel = $('#Client'), pf = $('#prospectFields');
    const upd = () => pf.style.display = sel.value ? 'none' : '';
    sel.onchange = upd; upd();
  });
}

function openQuoteActions(id) {
  const q = state.quotes.find(x => x._id === id);
  if (!q) return;
  const dlg = $('#dlg');
  const converted = q.Status === 'Converted';
  dlg.innerHTML = `<h2>${esc(q.QuoteID)}</h2>
    <p class="muted" style="margin-top:-14px;margin-bottom:18px">${esc(quoteName(q))} · ${money(q.Amount)}</p>
    ${!converted ? `<div class="field"><label for="qStatus">Status</label>
      <select id="qStatus">${QUOTE_STATUSES.map(s => `<option value="${s}" ${q.Status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>` : ''}
    <div class="sheet" style="margin-top:4px">
      <button type="button" class="sheet-item" id="printBtn">Print / share quotation</button>
      ${!converted ? `<button type="button" class="sheet-item" id="editBtn">Edit quotation</button>
      <button type="button" class="sheet-item" id="convBtn">Convert to order</button>` : ''}
      <button type="button" class="sheet-item danger" id="delBtn">Delete quotation</button>
    </div>
    <div class="actions"><button type="button" class="btn" id="cancel">Close</button></div>`;
  $('#cancel').onclick = () => dlg.close();
  $('#printBtn').onclick = () => { dlg.close(); printQuote(q); };
  $('#delBtn').onclick = () => { dlg.close(); deleteQuote(q); };
  const editBtn = $('#editBtn'); if (editBtn) editBtn.onclick = () => { dlg.close(); openQuoteForm(q); };
  const convBtn = $('#convBtn'); if (convBtn) convBtn.onclick = () => { dlg.close(); convertQuote(q); };
  const statusSel = $('#qStatus');
  if (statusSel) statusSel.onchange = async e => {
    const val = e.target.value;
    if (val === q.Status) return;
    try {
      const r = await api(`/quotes/${encodeURIComponent(q._id)}`, 'PATCH', { Status: val });
      const i = state.quotes.findIndex(x => x._id === r.quote._id);
      if (i > -1) state.quotes[i] = r.quote;
      toast(`${q.QuoteID} marked ${val}`);
      dlg.close();
      renderQuotes();
    } catch (err) { toast(err.message); e.target.value = q.Status; }
  };
  dlg.showModal();
}

function convertQuote(q) {
  if (q.Client) {
    if (!confirm(`Create a new order for ${esc(quoteName(q))} worth ${money(q.Amount)}?`)) return;
    doConvertQuote(q, q.Client);
    return;
  }
  // No linked client yet (it was a prospect) — pick or require one first.
  const fields = `<p class="muted" style="margin-top:0">This quotation was for a prospect, not yet a client. Pick who this order is for.</p>
    <div class="field"><label for="Client">Client</label>
      <select id="Client" name="Client" required>${state.clients.map(c => `<option value="${esc(c._id)}">${esc(c.name)} (${esc(c.Phone)})</option>`).join('')}</select></div>`;
  if (!state.clients.length) { toast('Add a client first, then convert this quotation'); return; }
  openForm(`Convert ${q.QuoteID}`, fields, 'Create order', async d => {
    await doConvertQuote(q, d.Client);
  });
}
async function doConvertQuote(q, clientId) {
  try {
    const r = await api(`/quotes/${encodeURIComponent(q._id)}/convert`, 'POST', { Client: clientId });
    const i = state.quotes.findIndex(x => x._id === r.quote._id);
    if (i > -1) state.quotes[i] = r.quote;
    state.orders.unshift(r.order);
    toast(`${r.order.OrderID} created from ${q.QuoteID}`);
    renderQuotes();
  } catch (err) { toast(err.message); }
}

function deleteQuote(q) {
  if (!confirm(`Delete quotation ${q.QuoteID}? This cannot be undone.`)) return;
  api(`/quotes/${encodeURIComponent(q._id)}`, 'DELETE')
    .then(() => { state.quotes = state.quotes.filter(x => x._id !== q._id); toast(`${q.QuoteID} deleted`); renderQuotes(); })
    .catch(err => toast(err.message));
}

function printQuote(q) {
  const html = `
    <div class="inv">
      <div class="inv-head">
        <div><h1>Primova</h1><p>Prime Solutions. Real Results.</p></div>
        <div class="inv-meta"><h2>Quotation</h2><p>${esc(q.QuoteID)}</p><p>${fmtDate(q.CreatedAt)}</p></div>
      </div>
      <div class="inv-parties">
        <div><b>Prepared for</b><p>${esc(quoteName(q))}</p>${q.ProspectPhone ? `<p>${esc(q.ProspectPhone)}</p>` : ''}</div>
        <div><b>Valid until</b><p>${q.ValidUntil ? fmtDate(q.ValidUntil) : 'Not specified'}</p></div>
      </div>
      <table class="inv-table">
        <thead><tr><th>Description</th><th class="num">Amount</th></tr></thead>
        <tbody><tr><td>${esc(q.Description)}</td><td class="num">${money(q.Amount)}</td></tr></tbody>
        <tfoot><tr class="strong"><td>Total quoted</td><td class="num">${money(q.Amount)}</td></tr></tfoot>
      </table>
      <p class="inv-status">This is a quotation, not a bill. Prices may change after this date.</p>
      <p class="inv-foot">Thank you for considering Primova</p>
    </div>`;
  $('#invoicePrint').innerHTML = html;
  setTimeout(() => window.print(), 50);
}

/* ---------- shared dialog ---------- */
function openForm(title, fields, submitLabel, onSubmit, afterOpen) {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form id="f"><h2>${esc(title)}</h2>${fields}
    <p class="err" id="ferr" role="alert"></p>
    <div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary" id="submit">${esc(submitLabel)}</button></div></form>`;
  $('#cancel').onclick = () => dlg.close();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#submit'); btn.disabled = true; $('#ferr').textContent = '';
    try {
      const data = Object.fromEntries(new FormData(e.target).entries());
      Object.keys(data).forEach(k => { if (typeof data[k] === 'string') data[k] = data[k].trim(); });
      await onSubmit(data);
      dlg.close();
    } catch (err) { $('#ferr').textContent = err.message; btn.disabled = false; }
  };
  dlg.showModal();
  if (afterOpen) afterOpen();
}

/* ---------- boot ---------- */
paintIcons(); logoInto();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
if (authToken) showApp();
else { $('#auth').hidden = false; setAuthMode('login'); }
</script>
</body>
</html>
